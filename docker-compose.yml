services:
  postgres:
    image: postgres:16
    container_name: safari-db-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the backend .env file}
    ports:
      - "5432:5432"
    volumes:
      - safari_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safari-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080

      # PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the backend .env file}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      APP_AUTH_COOKIE_SECURE: "false"
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}

      # Email configuration
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      # Paystack configuration
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-paystack}
      PAYSTACK_ENABLED: ${PAYSTACK_ENABLED:-false}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL:-${FRONTEND_URL:-http://localhost:5173}/payment/callback}

    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/tours > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safari-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5173
      BACKEND_URL: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  safari_postgres_data:
