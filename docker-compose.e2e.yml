services:
  e2e-mail:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:18025:8025"

  e2e-backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: e2e
      SERVER_PORT: 8080
      FRONTEND_URL: http://127.0.0.1:4173
      PAYMENT_PROVIDER: mock
      PAYSTACK_SECRET_KEY: ""
      APP_ADMIN_EMAIL: e2e-admin@example.com
      APP_AUTH_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/tours > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      e2e-mail:
        condition: service_started
